name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels a stale pull request run, but never a run on main: that one may be
  # in the middle of rolling out a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - run: pip install pre-commit
      - run: make check-hooks
      - name: Scan full git history for secrets
        run: gitleaks git --redact --verbose .

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: make check-api

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project: [pipeline, lib-python]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: make check-${{ matrix.project }}

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check-web

  # Builds and rolls out only what changed, once every check above has passed. Authenticates to
  # Google with the run's OIDC token (workload identity federation): no key is stored anywhere.
  # Set the two repository variables from `tofu output` first (deploy/gcp/README.md, step 8).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [hooks, api, python, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Check the deploy variables are set
        run: |
          if [ -z "$WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$DEPLOY_SERVICE_ACCOUNT" ]; then
            echo "::error::Set the repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT (deploy/gcp/README.md, step 8)."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Work out what changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A new branch or a force push has no usable "before": deploy everything.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files="api/ pipeline/ web/"
          else
            files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          fi
          components=""
          grep -q '^api/' <<<"$files" && components="$components api"
          grep -q '^pipeline/' <<<"$files" && components="$components pipeline"
          grep -q '^web/' <<<"$files" && components="$components web"
          echo "components=${components# }" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${components:-nothing}"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.changed.outputs.components != ''
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.changed.outputs.components != ''
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: steps.changed.outputs.components != ''
      - name: Build, push and roll out
        if: steps.changed.outputs.components != ''
        env:
          COMPONENTS: ${{ steps.changed.outputs.components }}
          SITE_URL: https://zeitwide.com
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          # shellcheck disable=SC2086
          bash deploy/gcp/deploy-images.sh $COMPONENTS
