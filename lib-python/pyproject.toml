[project]
name = "zeitwide"
version = "0.1.0"
description = "Is this a business day? Answers with evidence for payment rails and holiday calendars, offline or from the Zeitwide API."
readme = "README.md"
requires-python = ">=3.12"
# The code is MIT; the bundled dataset release is CC BY-NC 4.0 (LICENSE-DATA).
license = "MIT AND CC-BY-NC-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
keywords = ["business days", "holidays", "fedwire", "target2", "chaps", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# Offline answers need only the standard library; httpx is for ZeitWide(key=...).
dependencies = [
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://zeitwide.com"
Source = "https://github.com/susmitbanerjee/zeitwide"

[project.scripts]
zeitwide = "zeitwide.cli:main"

[tool.uv.workspace]
members = ["zeitwide-mcp"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "cryptography>=46",
  "datamodel-code-generator==0.83.0",
  "httpx>=0.28.1",
  "hypothesis>=6.170.12",
  "jsonschema>=4.26.0",
  "mcp>=2.3,<3",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.14",
  "types-jsonschema>=4.26.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Generated from api/openapi.yaml by `make generate-clients`; a test checks it is current.
extend-exclude = ["src/zeitwide/api_types.py"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "S", "SIM", "PT",
  "RET", "ARG", "PTH", "PL", "TRY", "PERF", "RUF", "ANN", "BLE", "T20", "ERA",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN201"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["zeitwide"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
