spring:
  ai:
    mcp:
      server:
        name: zeitwide-api
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC
        instructions: >-
          Never guess whether a date is a holiday; use a Zeitwide tool. Cite the returned
          source when explaining an answer. Store the receipt for later verification. Before
          acting on an old date, call get_changes to check for updates since the relevant time.
        streamable-http:
          mcp-endpoint: /mcp
  application:
    name: zeitwide-api
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # A misspelt field is an error, not a silently ignored default.
      fail-on-unknown-properties: true
  # No URL or credentials here: Cloud Run sets SPRING_DATASOURCE_* from Secret
  # Manager, bootRun connects to the compose Postgres, and tests use Testcontainers.
  datasource:
    hikari:
      # Aiven's free plan allows 20 connections across every client (deploy/gcp/README.md).
      maximum-pool-size: 4
  docker:
    compose:
      file: ../docker-compose.yml
      lifecycle-management: start-only

server:
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never

# JSON lines on Cloud Run, where LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash; plain text locally.
logging:
  structured:
    json:
      exclude:
        - "@version"
        - level_value
      customizer: com.zeitwide.api.observability.infra.CloudLoggingSeverity

management:
  otlp:
    metrics:
      export:
        # On in Cloud Run only. Endpoint and credentials: see OtlpMetricsConfiguration.
        enabled: ${ZEITWIDE_OTLP_METRICS_ENABLED:false}
  metrics:
    distribution:
      # A few fixed buckets instead of a full histogram: enough for the 200 ms p95 alert, and
      # cheap in active series.
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

zeitwide:
  auth:
    # The web app's public origin, and the secret it signs the tokens it sends the API with. No
    # default for the secret: see AuthProperties.
    issuer: ${ZEITWIDE_AUTH_ISSUER:http://localhost:3000}
    audience: ${ZEITWIDE_AUTH_AUDIENCE:zeitwide-api}
    token-secret: ${ZEITWIDE_AUTH_TOKEN_SECRET:}
  internal:
    audience: ${ZEITWIDE_OUTBOX_DRAIN_AUDIENCE:zeitwide-outbox-drain-local}
    service-account-email: ${ZEITWIDE_OUTBOX_DRAIN_INVOKER:scheduler@zeitwide.local}
    google-jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  cors:
    allowed-origins: ${ZEITWIDE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  receipts:
    active-key-id: ${ZEITWIDE_RECEIPT_KEY_ID:}
    signing-key-pem: ${ZEITWIDE_RECEIPT_SIGNING_KEY:}
    public-keys-json: ${ZEITWIDE_RECEIPT_PUBLIC_KEYS_JSON:[]}
  webhooks:
    encryption-key: ${ZEITWIDE_WEBHOOK_ENCRYPTION_KEY:}
  answers:
    cache-max-entries: 10000
    release-check-interval: PT30S
  rate-limits:
    anonymous:
      capacity: 60
      period: PT1H
    keyed:
      capacity: 10000
      period: P1D
    # The web app's own key, which prerenders and refreshes every answer page.
    first-party:
      capacity: 500000
      period: P1D
    first-party-key-ids: ${ZEITWIDE_RATE_LIMITS_FIRST_PARTY_KEY_IDS:}
    trusted-proxies: 0
