spring:
  application:
    name: settlecal-api
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  # No URL or credentials here: Cloud Run sets SPRING_DATASOURCE_* from Secret
  # Manager, bootRun connects to the compose Postgres, and tests use Testcontainers.
  datasource:
    hikari:
      maximum-pool-size: 5
  docker:
    compose:
      file: ../docker-compose.yml
      lifecycle-management: start-only

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
