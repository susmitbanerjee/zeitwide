# Local development stack. Ports bind to 127.0.0.1 only; credentials are local-only defaults.
name: zeitwide

services:
  postgres:
    # Same version as the Aiven service Zeitwide runs on.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: zeitwide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeitwide}
      POSTGRES_DB: zeitwide
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker, so the volume
      # mounts one level up. A new name leaves any Postgres 16 volume untouched.
      - postgres18-data:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeitwide -d zeitwide"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_DB_POOL_MAX_SIZE: "3"
      ZEITWIDE_WEB_ORIGIN: ${ZEITWIDE_WEB_ORIGIN:-http://localhost:3000}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image ships without curl, so probe the management port with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  fake-gcs:
    image: fsouza/fake-gcs-server:1.55.1
    command:
      - -scheme=http
      - -port=4443
      - -external-url=http://localhost:${GCS_PORT:-4443}
      - -backend=filesystem
      - -filesystem-root=/storage
    ports:
      - "127.0.0.1:${GCS_PORT:-4443}:4443"
    volumes:
      - ./deploy/fake-gcs:/data:ro
      - gcs-data:/storage

volumes:
  postgres18-data:
  gcs-data:
