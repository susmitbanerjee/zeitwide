[project]
name = "zeitwide-pipeline"
version = "0.1.0"
description = "Zeitwide data pipeline: source monitors, parsers, diffing, review CLI and release builder."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pdfplumber>=0.11.10",
    "procrastinate==3.10.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=24",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "xmlschema>=4.1",
]

[project.scripts]
zeitwide-pipeline = "zeitwide_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zeitwide_pipeline"

[tool.uv.sources]
zeitwide = { path = "../lib-python", editable = true }

[dependency-groups]
dev = [
  "jsonschema>=4.26.0",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "respx>=0.23.1",
  "ruff>=0.14",
  "zeitwide",
  "testcontainers[postgres]>=4.15.0",
  "types-jsonschema>=4.26.0.20261006",
  "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "S", "SIM", "PT",
  "RET", "ARG", "PTH", "PL", "TRY", "PERF", "RUF", "ANN", "BLE", "T20", "ERA",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# Test doubles implement protocol signatures without using every argument.
"tests/**" = ["S101", "S106", "PLR2004", "ANN201", "ARG002"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "tests"]
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# pyarrow ships without type information.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# google-cloud-storage ships without type information.
[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared test helpers live in tests/support/.
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["zeitwide_pipeline"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
